name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  # Classify the diff. The heavy jobs below run only when code changed; on a
  # docs-only change they are skipped, which still reports each check as passing
  # so required status checks stay satisfied without running the full build.
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'Makefile'
              - '.golangci.yml'
              - 'codecov.yml'
              - '.github/workflows/**'

  build-test:
    name: build & test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      - name: test (race + coverage)
        run: go test -race -count=1 -covermode=atomic -coverpkg=./codec/...,./cmd/goserdegen/... -coverprofile=coverage.out ./...
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: Tochemey/goserde
          files: ./coverage.out
      - name: generated code is up to date
        run: |
          go generate ./...
          git diff --exit-code

  fuzz-smoke:
    name: fuzz smoke
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: fuzz round-trip (fast)
        run: go test ./cmd/goserdegen/ -run '^$' -fuzz '^FuzzRoundTrip$' -fuzztime 30s
      - name: fuzz decode (safe)
        run: go test ./cmd/goserdegen/ -run '^$' -fuzz '^FuzzAllDecode$' -fuzztime 30s

  lint:
    name: golangci-lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  # Report-only benchmark smoke: runs the shape benchmarks on the PR base and
  # head and prints a benchstat comparison in the job log. It never fails the
  # build (shared runners are too noisy for a hard gate); it exists so a perf
  # regression is visible in review rather than discovered after merge.
  bench-smoke:
    name: benchmark smoke (report-only)
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@latest
      # Generated code is committed and its freshness is enforced by
      # build-test, so each ref benchmarks its own checked-in codecs.
      - name: bench base
        run: |
          git checkout ${{ github.event.pull_request.base.sha }}
          go test ./cmd/goserdegen/ -run '^$' -bench . -benchmem -count=6 | tee /tmp/bench-base.txt
      - name: bench head
        run: |
          git checkout ${{ github.event.pull_request.head.sha }}
          go test ./cmd/goserdegen/ -run '^$' -bench . -benchmem -count=6 | tee /tmp/bench-head.txt
      - name: benchstat report
        run: |
          benchstat /tmp/bench-base.txt /tmp/bench-head.txt | tee /tmp/benchstat.txt
          {
            echo '### Benchmark comparison (base vs head, report-only)'
            echo '```'
            cat /tmp/benchstat.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
